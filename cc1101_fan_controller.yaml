# RF ceiling-fan remote bridged over a CC1101, so the fan can be driven from
# Home Assistant and its physical remote stays in sync.
# https://esphome.io/components/cc1101
---
substitutions:
  rc_switch_protocol: "6"
  cc1101_frequency_rx: "303.87"
  cc1101_frequency_tx: "307.0"

  # Default Pins (Can be overridden in main config)
  # Standard ESP32 VSPI pins are used as defaults here
  pin_spi_clk: GPIO18
  pin_spi_mosi: GPIO23
  pin_spi_miso: GPIO19
  pin_cc1101_cs: GPIO5
  # GDO0 and GDO2. These are deliberately not declared as the cc1101
  # component's gdo0_pin: remote_receiver and remote_transmitter own them, and
  # begin_tx/begin_rx must not fight them over the pin mode.
  pin_remote_rx: GPIO27
  pin_remote_tx: GPIO26

  # Fan codes (12 bits)
  code_fan_off: "125"
  code_fan_low: "119"
  code_fan_med: "111"
  code_fan_high: "95"
  # Light/Rev codes
  code_light_hold: "126"
  code_rev_hold: "123"
  code_common_release: "127"  # Common release code for all buttons

esphome:
  on_boot:
    # Late enough that every component has run setup(), which is when a
    # restored fan state is published. Until this flips, the fan's on_state
    # trigger must not transmit, or the device would blast an RF command at
    # every boot.
    priority: -100
    then:
      - lambda: id(fan_tx_ready) = true;

globals:
  - id: fan_tx_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  # Last speed known to be on the air, whether we sent it or heard the remote
  # send it. Guards against re-transmitting a state we did not originate.
  - id: fan_last_tx_speed
    type: int
    restore_value: false
    initial_value: '-1'

spi:
  clk_pin: ${pin_spi_clk}
  mosi_pin: ${pin_spi_mosi}
  miso_pin: ${pin_spi_miso}
  interface: hardware

cc1101:
  id: cc1101_hub
  cs_pin: ${pin_cc1101_cs}
  frequency: ${cc1101_frequency_rx}MHz
  output_power: 11

remote_transmitter:
  id: remote_tx
  pin: ${pin_remote_tx}
  carrier_duty_percent: 100%
  non_blocking: true
  # on_transmit fires immediately *before* the RMT starts driving the pin, and
  # the automation does not block the transmission. So every action here has to
  # be synchronous: a `delay:` would yield, the RMT would start clocking data
  # out while the radio was still in RX, and the first chunk of the burst would
  # go nowhere. cc1101.set_frequency and cc1101.begin_tx are both synchronous.
  # Order matters too: set_frequency leaves the radio in RX, so begin_tx has to
  # come after it.
  on_transmit:
    - cc1101.set_frequency: !lambda 'return id(cc1101_freq_tx).state * 1e6f;'
    - cc1101.begin_tx: cc1101_hub
  on_complete:
    - cc1101.set_frequency: !lambda 'return id(cc1101_freq_rx).state * 1e6f;'
    - cc1101.begin_rx: cc1101_hub

remote_receiver:
  - pin: ${pin_remote_rx}
    tolerance: 50%
    filter: 250us
    idle: 4ms
    buffer_size: 2kb
    rmt_symbols: 96
    on_rc_switch:
      - lambda: |-
          // Logged before the protocol check so an unknown remote can still be
          // identified. Set `logger: level: DEBUG` to discover a new one; no
          // `dump:` is needed.
          ESP_LOGD("cc1101_fan", "RF rx protocol=%u code=0x%llX (%llu)", x.protocol, x.code, x.code);
          if (x.protocol != ${rc_switch_protocol}) return;

          int rx_speed = -1;
          if (x.code == ${code_fan_off}) {
            rx_speed = 0;
            id(remote_fan_off_btn_state).publish_state(true);
            id(remote_fan_off_btn_state).publish_state(false);
          } else if (x.code == ${code_fan_low}) {
            rx_speed = 1;
          } else if (x.code == ${code_fan_med}) {
            rx_speed = 2;
          } else if (x.code == ${code_fan_high}) {
            rx_speed = 3;
          } else if (x.code == ${code_light_hold}) {
            id(remote_light_btn_state).publish_state(true);
            id(remote_light_btn_state).publish_state(false);
          } else if (x.code == ${code_rev_hold}) {
            id(remote_rev_btn_state).publish_state(true);
            id(remote_rev_btn_state).publish_state(false);
          } else if (x.code == ${code_common_release}) {
            id(remote_fan_off_btn_state).publish_state(false);
            id(remote_light_btn_state).publish_state(false);
            id(remote_rev_btn_state).publish_state(false);
          }

          if (rx_speed >= 0) {
            // Record the speed *before* publishing. publish_state() runs the
            // fan's state callbacks synchronously, and the on_state trigger
            // below feeds transmit_fan_code, which would otherwise echo back
            // the very command the remote just sent.
            id(fan_last_tx_speed) = rx_speed;
            id(fan1).state = rx_speed > 0;
            id(fan1).speed = rx_speed;
            id(fan1).publish_state();
            ESP_LOGI("cc1101_fan", "Remote set fan speed %d", rx_speed);
          }

binary_sensor:
  - platform: template
    name: "Remote Light Button State"
    id: remote_light_btn_state
    entity_category: diagnostic
    filters:
      - delayed_off: 300ms

  - platform: template
    name: "Remote Rev Button State"
    id: remote_rev_btn_state
    entity_category: diagnostic
    filters:
      - delayed_off: 300ms

  - platform: template
    name: "Remote Fan Off Button State"
    id: remote_fan_off_btn_state
    entity_category: diagnostic
    filters:
      - delayed_off: 300ms

script:
  # Transmits a fan speed. Deduplicated unless force is set, because the fan's
  # on_state trigger fires for *every* publish, including the ones this package
  # makes itself; without the guard a single HA command transmitted twice and a
  # remote button press transmitted an echo.
  - id: transmit_fan_code
    mode: single
    parameters:
      speed: int  # 0=Off, 1=Low, 2=Med, 3=High
      force: bool
    then:
      - lambda: |-
          if (!force && (!id(fan_tx_ready) || speed == id(fan_last_tx_speed))) {
            return;
          }
          id(fan_last_tx_speed) = speed;

          uint64_t code;
          if (speed == 1) code = ${code_fan_low};
          else if (speed == 2) code = ${code_fan_med};
          else if (speed == 3) code = ${code_fan_high};
          else code = ${code_fan_off};

          ESP_LOGI("cc1101_fan", "Transmitting fan speed %d code=0x%llX (%llu)", speed, code, code);

          auto transmit = id(remote_tx).transmit();
          transmit.set_send_times((int) id(transmit_repeat_times).state);
          transmit.set_send_wait(0);
          esphome::remote_base::RC_SWITCH_PROTOCOLS[${rc_switch_protocol}].transmit(transmit.get_data(), code, 12);
          transmit.perform();

  # Reflects a speed onto the fan entity without transmitting it. Kept separate
  # from transmit_fan_code so the publish below can never re-enter that script.
  - id: apply_fan_speed
    mode: single
    parameters:
      speed: int
    then:
      - lambda: |-
          id(fan_last_tx_speed) = speed;
          id(fan1).state = speed > 0;
          id(fan1).speed = speed;
          id(fan1).publish_state();

fan:
  - platform: template
    name: "Fan"
    id: fan1
    speed_count: 3
    # A single on_state, rather than on_turn_on + on_speed_set: those two both
    # fire for one HA command, which transmitted the burst twice.
    on_state:
      - script.execute:
          id: transmit_fan_code
          speed: !lambda 'return id(fan1).state ? id(fan1).speed : 0;'
          force: false

button:
  - platform: template
    name: "Fan High"
    icon: mdi:fan-speed-3
    disabled_by_default: true
    entity_category: config
    on_press:
      - script.execute: {id: transmit_fan_code, speed: 3, force: true}
      - script.execute: {id: apply_fan_speed, speed: 3}
  - platform: template
    name: "Fan Medium"
    icon: mdi:fan-speed-2
    disabled_by_default: true
    entity_category: config
    on_press:
      - script.execute: {id: transmit_fan_code, speed: 2, force: true}
      - script.execute: {id: apply_fan_speed, speed: 2}
  - platform: template
    name: "Fan Low"
    icon: mdi:fan-speed-1
    disabled_by_default: true
    entity_category: config
    on_press:
      - script.execute: {id: transmit_fan_code, speed: 1, force: true}
      - script.execute: {id: apply_fan_speed, speed: 1}
  - platform: template
    name: "Fan Off"
    icon: mdi:fan-off
    disabled_by_default: true
    entity_category: config
    on_press:
      - script.execute: {id: transmit_fan_code, speed: 0, force: true}
      - script.execute: {id: apply_fan_speed, speed: 0}

number:
  - platform: template
    name: "Frequency RX"
    id: cc1101_freq_rx
    icon: mdi:radio-tower
    entity_category: config
    min_value: 300.00
    max_value: 435.00
    step: 0.01
    optimistic: true
    initial_value: ${cc1101_frequency_rx}
    restore_value: true
    mode: box
    # Applied on restore at boot too, since restoring publishes the value.
    on_value:
      then:
        - cc1101.set_frequency: !lambda 'return x * 1e6f;'

  - platform: template
    name: "Frequency TX"
    id: cc1101_freq_tx
    icon: mdi:radio-tower
    entity_category: config
    min_value: 300.00
    max_value: 435.00
    step: 0.01
    optimistic: true
    initial_value: ${cc1101_frequency_tx}
    restore_value: true
    mode: box

  - platform: template
    name: "Repeat Times"
    id: transmit_repeat_times
    icon: mdi:repeat
    entity_category: config
    min_value: 1
    max_value: 500
    step: 1
    optimistic: true
    initial_value: 50
    restore_value: true
    mode: box
