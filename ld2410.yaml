# https://esphome.io/components/sensor/ld2410
#
# Requires a `uart:` in your own config; see the README.
---
substitutions:
  # Prefixes every entity name, so two radars on one device do not collide.
  ld2410_prefix: ''

api:
  actions:
    - action: set_ld2410_bluetooth_password
      variables:
        password: string
      then:
        - bluetooth_password.set:
            id: ld2410_radar
            password: !lambda 'return password;'

ld2410:
  id: ld2410_radar

binary_sensor:
  - platform: ld2410
    has_target:
      name: ${ld2410_prefix}Radar Target
      id: radar_has_target
    has_moving_target:
      name: ${ld2410_prefix}Radar Moving Target
    has_still_target:
      name: ${ld2410_prefix}Radar Still Target
    out_pin_presence_status:
      name: ${ld2410_prefix}Radar Out Pin Presence Status
      disabled_by_default: true

sensor:
  - platform: ld2410
    light:
      name: ${ld2410_prefix}Radar Light
      disabled_by_default: true
    moving_distance:
      name: ${ld2410_prefix}Radar Moving Distance
      disabled_by_default: true
    still_distance:
      name: ${ld2410_prefix}Radar Still Distance
      disabled_by_default: true
    moving_energy:
      name: ${ld2410_prefix}Radar Move Energy
      disabled_by_default: true
    still_energy:
      name: ${ld2410_prefix}Radar Still Energy
      disabled_by_default: true
    detection_distance:
      name: ${ld2410_prefix}Radar Detection Distance
      id: radar_detection_distance
      disabled_by_default: true
    g0:
      move_energy:
        name: ${ld2410_prefix}g0 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g0 still energy
        disabled_by_default: true
    g1:
      move_energy:
        name: ${ld2410_prefix}g1 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g1 still energy
        disabled_by_default: true
    g2:
      move_energy:
        name: ${ld2410_prefix}g2 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g2 still energy
        disabled_by_default: true
    g3:
      move_energy:
        name: ${ld2410_prefix}g3 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g3 still energy
        disabled_by_default: true
    g4:
      move_energy:
        name: ${ld2410_prefix}g4 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g4 still energy
        disabled_by_default: true
    g5:
      move_energy:
        name: ${ld2410_prefix}g5 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g5 still energy
        disabled_by_default: true
    g6:
      move_energy:
        name: ${ld2410_prefix}g6 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g6 still energy
        disabled_by_default: true
    g7:
      move_energy:
        name: ${ld2410_prefix}g7 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g7 still energy
        disabled_by_default: true
    g8:
      move_energy:
        name: ${ld2410_prefix}g8 move energy
        disabled_by_default: true
      still_energy:
        name: ${ld2410_prefix}g8 still energy
        disabled_by_default: true

switch:
  - platform: ld2410
    engineering_mode:
      name: ${ld2410_prefix}Radar Engineering Mode
      disabled_by_default: true
    bluetooth:
      name: ${ld2410_prefix}Radar Bluetooth

number:
  - platform: ld2410
    timeout:
      name: ${ld2410_prefix}Radar Timeout
      disabled_by_default: true
    light_threshold:
      name: ${ld2410_prefix}Radar Light Threshold
      disabled_by_default: true
    max_move_distance_gate:
      name: ${ld2410_prefix}Radar Max Move Distance Gate
      disabled_by_default: true
    max_still_distance_gate:
      name: ${ld2410_prefix}Radar Max Still Distance Gate
      disabled_by_default: true
    g0:
      move_threshold:
        name: ${ld2410_prefix}g0 move threshold
        disabled_by_default: true
      still_threshold:
        name: ${ld2410_prefix}g0 still threshold
        disabled_by_default: true
    g1:
      move_threshold:
        name: ${ld2410_prefix}g1 move threshold
        disabled_by_default: true
      still_threshold:
        name: ${ld2410_prefix}g1 still threshold
        disabled_by_default: true
    g2:
      move_threshold:
        name: ${ld2410_prefix}g2 move threshold
        disabled_by_default: true
      still_threshold:
        name: ${ld2410_prefix}g2 still threshold
        disabled_by_default: true
    g3:
      move_threshold:
        disabled_by_default: true
        name: ${ld2410_prefix}g3 move threshold
      still_threshold:
        name: ${ld2410_prefix}g3 still threshold
        disabled_by_default: true
    g4:
      move_threshold:
        name: ${ld2410_prefix}g4 move threshold
        disabled_by_default: true
      still_threshold:
        name: ${ld2410_prefix}g4 still threshold
        disabled_by_default: true
    g5:
      move_threshold:
        name: ${ld2410_prefix}g5 move threshold
        disabled_by_default: true
      still_threshold:
        name: ${ld2410_prefix}g5 still threshold
        disabled_by_default: true
    g6:
      move_threshold:
        name: ${ld2410_prefix}g6 move threshold
        disabled_by_default: true
      still_threshold:
        name: ${ld2410_prefix}g6 still threshold
        disabled_by_default: true
    g7:
      move_threshold:
        name: ${ld2410_prefix}g7 move threshold
        disabled_by_default: true
      still_threshold:
        name: ${ld2410_prefix}g7 still threshold
        disabled_by_default: true
    g8:
      move_threshold:
        name: ${ld2410_prefix}g8 move threshold
        disabled_by_default: true
      still_threshold:
        name: ${ld2410_prefix}g8 still threshold
        disabled_by_default: true

button:
  - platform: ld2410
    factory_reset:
      name: ${ld2410_prefix}Factory Reset Radar
      disabled_by_default: true
    restart:
      name: ${ld2410_prefix}Restart Radar
      disabled_by_default: true
    query_params:
      name: ${ld2410_prefix}Query Params Radar
      disabled_by_default: true

text_sensor:
  - platform: ld2410
    version:
      name: ${ld2410_prefix}Radar Firmware Version
      disabled_by_default: true
    mac_address:
      name: ${ld2410_prefix}Radar Mac Address
      disabled_by_default: true

select:
  - platform: ld2410
    distance_resolution:
      name: ${ld2410_prefix}Radar Distance Resolution
      disabled_by_default: true
    baud_rate:
      name: ${ld2410_prefix}Radar Baud Rate
      disabled_by_default: true
    light_function:
      name: ${ld2410_prefix}Radar Light Function
      disabled_by_default: true
    out_pin_level:
      name: ${ld2410_prefix}Radar Out Pin Level
      disabled_by_default: true
